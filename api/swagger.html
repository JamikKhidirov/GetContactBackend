<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>GetContact API — Swagger UI</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📞</text></svg>" />
  <link rel="stylesheet" href="/docs/assets/swagger-ui.css" />
  <style>
    :root {
      --gc-bg: #ffffff;
      --gc-surface: #f8fafc;
      --gc-surface-2: #eef2f7;
      --gc-text: #0f172a;
      --gc-muted: #475569;
      --gc-border: #dbe3ee;
      --gc-accent: #0891b2;
      color-scheme: light;
    }

    html[data-theme="dark"] {
      --gc-bg: #070b14;
      --gc-surface: #0d1524;
      --gc-surface-2: #111c2e;
      --gc-text: #e5eefc;
      --gc-muted: #9fb0c9;
      --gc-border: #1e293b;
      --gc-accent: #22d3ee;
      color-scheme: dark;
    }

    html, body { min-height: 100%; }
    body {
      margin: 0;
      background: var(--gc-bg);
      color: var(--gc-text);
      transition: background-color .18s ease, color .18s ease;
    }
    .topbar { display: none; }
    #swagger-ui { max-width: 1280px; margin: 0 auto; padding: 16px; }

    /* Theme switch (fixed in the top-right corner). */
    #theme-toggle {
      position: fixed;
      top: 14px;
      right: 16px;
      z-index: 1000;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 13px;
      font: 600 13px/1.2 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--gc-text);
      background: var(--gc-surface);
      border: 1px solid var(--gc-border);
      border-radius: 999px;
      box-shadow: 0 2px 10px rgba(15, 23, 42, .08);
      cursor: pointer;
      transition: background-color .18s ease, color .18s ease, border-color .18s ease;
    }
    #theme-toggle:hover { border-color: var(--gc-accent); }
    #theme-toggle:focus-visible { outline: 2px solid var(--gc-accent); outline-offset: 2px; }

    /* Shared text colors so both themes stay readable. */
    .swagger-ui,
    .swagger-ui .info .title,
    .swagger-ui .info p,
    .swagger-ui .info li,
    .swagger-ui .info a,
    .swagger-ui .opblock-tag,
    .swagger-ui .opblock-tag small,
    .swagger-ui .opblock .opblock-summary,
    .swagger-ui .opblock .opblock-summary-description,
    .swagger-ui .opblock-description-wrapper p,
    .swagger-ui .opblock-external-docs-wrapper p,
    .swagger-ui .opblock-title_normal,
    .swagger-ui .tab li,
    .swagger-ui .markdown p,
    .swagger-ui .markdown li,
    .swagger-ui .renderedMarkdown p,
    .swagger-ui .renderedMarkdown li,
    .swagger-ui .response-col_status,
    .swagger-ui .response-col_description,
    .swagger-ui .parameter__name,
    .swagger-ui .parameter__type,
    .swagger-ui .model-title,
    .swagger-ui .model,
    .swagger-ui .property-row,
    .swagger-ui .scopes h2 {
      color: var(--gc-text);
    }
    .swagger-ui .info .title small { color: #0b1220; }
    .swagger-ui .scheme-container {
      background: var(--gc-surface);
      box-shadow: none;
      border: 1px solid var(--gc-border);
      border-radius: 12px;
    }
    .swagger-ui .opblock-tag { border-bottom-color: var(--gc-border); }
    .swagger-ui .info { margin: 24px 0; }
    .swagger-ui .info .title small { background: var(--gc-accent); }
    .swagger-ui .btn.authorize { border-color: var(--gc-accent); color: var(--gc-accent); }
    .swagger-ui .btn.authorize svg { fill: var(--gc-accent); }

    .swagger-ui .opblock.opblock-get .opblock-summary-method { background: #0284c7; }
    .swagger-ui .opblock.opblock-post .opblock-summary-method { background: #059669; }
    .swagger-ui .opblock.opblock-patch .opblock-summary-method { background: #d97706; }
    .swagger-ui .opblock.opblock-delete .opblock-summary-method { background: #dc2626; }

    /* Dark (night) theme: override the default light surfaces. */
    html[data-theme="dark"] .swagger-ui .opblock {
      background: var(--gc-surface) !important;
      border-color: var(--gc-border) !important;
    }
    html[data-theme="dark"] .swagger-ui .opblock .opblock-summary {
      border-color: var(--gc-border);
    }
    html[data-theme="dark"] .swagger-ui .opblock.is-open .opblock-summary {
      border-bottom-color: var(--gc-border);
    }
    html[data-theme="dark"] .swagger-ui .opblock-body,
    html[data-theme="dark"] .swagger-ui .opblock-section-header,
    html[data-theme="dark"] .swagger-ui .responses-inner,
    html[data-theme="dark"] .swagger-ui .request-body {
      background: var(--gc-surface);
      color: var(--gc-text);
    }
    html[data-theme="dark"] .swagger-ui .opblock-section-header h4,
    html[data-theme="dark"] .swagger-ui .opblock-section-header label,
    html[data-theme="dark"] .swagger-ui .opblock-section-header .btn {
      color: var(--gc-text);
    }
    html[data-theme="dark"] .swagger-ui .opblock-body pre.microlight,
    html[data-theme="dark"] .swagger-ui .highlight-code,
    html[data-theme="dark"] .swagger-ui .highlight-code pre,
    html[data-theme="dark"] .swagger-ui .microlight {
      background: #0b1220 !important;
      color: #d7e3ff !important;
    }
    html[data-theme="dark"] .swagger-ui .markdown code,
    html[data-theme="dark"] .swagger-ui .renderedMarkdown code {
      background: #1e293b;
      color: #a5f3fc;
    }
    html[data-theme="dark"] .swagger-ui table thead tr td,
    html[data-theme="dark"] .swagger-ui table thead tr th {
      background: var(--gc-surface-2) !important;
      color: var(--gc-text) !important;
      border-color: var(--gc-border) !important;
    }
    html[data-theme="dark"] .swagger-ui table tbody tr td,
    html[data-theme="dark"] .swagger-ui table tbody tr th {
      color: var(--gc-text);
      border-color: var(--gc-border);
    }
    html[data-theme="dark"] .swagger-ui .btn {
      background: transparent;
      border-color: var(--gc-border);
      color: var(--gc-text);
    }
    html[data-theme="dark"] .swagger-ui .btn.execute {
      background: #0e7490;
      border-color: #0e7490;
      color: #ffffff;
    }
    html[data-theme="dark"] .swagger-ui .btn.cancel {
      border-color: #f87171;
      color: #fca5a5;
    }
    html[data-theme="dark"] .swagger-ui input:not([type=checkbox]):not([type=radio]),
    html[data-theme="dark"] .swagger-ui textarea,
    html[data-theme="dark"] .swagger-ui select {
      background-color: #0f172a !important;
      color: var(--gc-text) !important;
      border-color: var(--gc-border) !important;
    }
    html[data-theme="dark"] .swagger-ui .tab li { color: var(--gc-muted); }
    html[data-theme="dark"] .swagger-ui .tab li.active { color: var(--gc-text); }
    html[data-theme="dark"] .swagger-ui section.models,
    html[data-theme="dark"] .swagger-ui .model-container,
    html[data-theme="dark"] .swagger-ui .model-box {
      background: var(--gc-surface);
      border-color: var(--gc-border);
    }
    html[data-theme="dark"] .swagger-ui section.models.is-open h4,
    html[data-theme="dark"] .swagger-ui .model-toggle {
      border-bottom-color: var(--gc-border);
      color: var(--gc-text);
    }
    html[data-theme="dark"] .swagger-ui .model-hint {
      background: #1e293b;
      color: #cbd5e1;
    }
    html[data-theme="dark"] .swagger-ui .auth-container,
    html[data-theme="dark"] .swagger-ui .auth-btn-wrapper {
      border-color: var(--gc-border);
    }
    html[data-theme="dark"] .swagger-ui .dialog-ux .modal-ux {
      background: var(--gc-surface);
      color: var(--gc-text);
      border-color: var(--gc-border);
    }
    html[data-theme="dark"] .swagger-ui .dialog-ux .modal-ux-header h3,
    html[data-theme="dark"] .swagger-ui .dialog-ux .modal-ux-content p,
    html[data-theme="dark"] .swagger-ui .dialog-ux .modal-ux-content h4,
    html[data-theme="dark"] .swagger-ui .dialog-ux .modal-ux-content label {
      color: var(--gc-text);
    }
    html[data-theme="dark"] .swagger-ui .dialog-ux .modal-ux-header {
      border-bottom-color: var(--gc-border);
    }
    html[data-theme="dark"] .swagger-ui .servers > label,
    html[data-theme="dark"] .swagger-ui .servers-title {
      color: var(--gc-text);
    }
    html[data-theme="dark"] .swagger-ui .download-contents,
    html[data-theme="dark"] .swagger-ui .copy-to-clipboard {
      background: #1e293b;
      color: var(--gc-text);
    }
    html[data-theme="dark"] .swagger-ui .loading-container .loading:after {
      color: var(--gc-text);
    }
  </style>
</head>
<body>
  <button id="theme-toggle" type="button" aria-label="Переключить светлую и тёмную тему" aria-pressed="false">🌙 Ночь</button>
  <div id="swagger-ui"></div>
  <script>
    (function () {
      var STORAGE_KEY = 'gc-swagger-theme';
      var root = document.documentElement;
      var button = document.getElementById('theme-toggle');

      function apply(theme) {
        root.setAttribute('data-theme', theme);
        var dark = theme === 'dark';
        button.textContent = dark ? '☀️ День' : '🌙 Ночь';
        button.setAttribute('aria-pressed', String(dark));
        try { localStorage.setItem(STORAGE_KEY, theme); } catch (e) {}
      }

      var saved = null;
      try { saved = localStorage.getItem(STORAGE_KEY); } catch (e) {}
      apply(saved === 'dark' ? 'dark' : 'light');

      button.addEventListener('click', function () {
        apply(root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
      });
    })();
  </script>
  <script src="/docs/assets/swagger-ui-bundle.js"></script>
  <script>
    window.onload = () => {
      window.ui = SwaggerUIBundle({
        url: '/openapi.yaml',
        dom_id: '#swagger-ui',
        deepLinking: true,
        persistAuthorization: true,
        displayRequestDuration: true,
        filter: true,
        tryItOutEnabled: true,
        presets: [SwaggerUIBundle.presets.apis],
      });
    };
  </script>
</body>
</html>
