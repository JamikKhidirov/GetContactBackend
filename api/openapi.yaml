openapi: 3.0.3
info:
  title: GetContact API
  version: 1.0.0
  description: |
    **GetContact** — бэкенд определения номеров: профили номеров, community-теги,
    спам-репорты, личная телефонная книга и админ-панель.

    ## Возможности
    - JWT access/refresh с ротацией refresh-токенов и blacklist при logout.
    - Публичный caller-ID lookup с кэшем Redis и счётчиком просмотров.
    - Community-теги и спам-репорты с пересчётом spam score 0..100.
    - Личная телефонная книга с bulk-import до 500 контактов.
    - Админ-статистика, блокировка пользователей, модерация репортов.
    - Kafka-события, Prometheus-метрики, Grafana-дашборд.

    ## Авторизация
    1. `POST /api/v1/auth/register` или `POST /api/v1/auth/login`.
    2. Возьмите `data.tokens.access_token` и передайте заголовок
       `Authorization: Bearer <access_token>`.
    3. Access token живёт 15 минут, refresh token — 30 дней и одноразовый.
    4. `POST /api/v1/auth/logout` отзывает refresh и заносит access JTI в Redis blacklist.

    ## Формат ответов
    Успех: `{ "data": ... }`, списки дополнительно содержат `meta`.
    Ошибка: `{ "error": { "code", "message", "details", "request_id" } }`.

    ## Коды ошибок
    `VALIDATION_ERROR` (422), `UNAUTHORIZED` (401), `FORBIDDEN` (403),
    `NOT_FOUND` (404), `CONFLICT` (409), `RATE_LIMITED` (429),
    `INTERNAL_ERROR` (500), `REQUEST_TIMEOUT` (504).
  contact:
    name: GetContact Platform Team
    email: api@getcontact.local
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: http://localhost:8080
    description: Local Docker Compose
  - url: https://api.getcontact.example
    description: Production
security:
  - bearerAuth: []
tags:
  - name: Health
    description: Живость, readiness, версия, метрики и документация
  - name: Auth
    description: Регистрация, вход, refresh-ротация и logout
  - name: Users
    description: Профиль текущего пользователя
  - name: Contacts
    description: Личная телефонная книга
  - name: Numbers
    description: Caller-ID, теги и спам-репорты
  - name: Search
    description: Единый поиск по номерам и контактам
  - name: Admin
    description: Админ-панель (роль admin)

paths:
  /:
    get:
      tags: [Health]
      summary: Индекс сервиса
      security: []
      responses:
        '200':
          description: Метаданные сервиса и ссылки
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ServiceInfo'

  /healthz:
    get:
      tags: [Health]
      summary: Liveness probe
      security: []
      responses:
        '200':
          description: Процесс жив
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /readyz:
    get:
      tags: [Health]
      summary: Readiness probe
      description: Проверяет Postgres, Redis и Kafka (если включена).
      security: []
      responses:
        '200':
          description: Все зависимости доступны
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ready'
        '503':
          description: Одна или несколько зависимостей недоступны
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ready'

  /version:
    get:
      tags: [Health]
      summary: Версия сборки
      security: []
      responses:
        '200':
          description: Версия и окружение
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/VersionInfo'

  /metrics:
    get:
      tags: [Health]
      summary: Prometheus metrics
      description: Текстовый формат Prometheus 0.0.4.
      security: []
      responses:
        '200':
          description: Метрики процесса
          content:
            text/plain:
              schema:
                type: string

  /openapi.yaml:
    get:
      tags: [Health]
      summary: Эта OpenAPI-спецификация
      security: []
      responses:
        '200':
          description: YAML-документ
          content:
            application/yaml:
              schema:
                type: string

  /docs:
    get:
      tags: [Health]
      summary: Swagger UI
      security: []
      responses:
        '200':
          description: HTML-страница Swagger UI
          content:
            text/html:
              schema:
                type: string

  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Регистрация
      description: Создаёт пользователя и сразу выдаёт пару токенов.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              phone: "+79991234567"
              password: "Passw0rd123"
              display_name: "Ivan Petrov"
              email: "ivan@example.com"
      responses:
        '201':
          description: Пользователь создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataAuthResult'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Вход по телефону и паролю
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              phone: "+79991234567"
              password: "Passw0rd123"
      responses:
        '200':
          description: Успешный вход
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataAuthResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Ротация refresh-токена
      description: Refresh token одноразовый. Повторное использование возвращает 401.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Новая пара токенов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataAuthResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Выход
      description: Отзывает refresh token (если передан) и blacklist-ит текущий access JTI.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '204':
          description: Сессия завершена
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Текущий пользователь
      responses:
        '200':
          description: Профиль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/auth/sessions:
    get:
      tags: [Auth, Sessions]
      summary: Активные сессии (устройства) пользователя
      description: |
        Возвращает только сессии владельца токена. Поля устройства и сети
        заполняются из необязательных заголовков `X-Device-*`, `X-OS-*`,
        `X-App-*`, `X-Client`, `X-Locale`, `X-Timezone`, `X-Network-Type` или
        из необязательного объекта `device` в теле register/login/refresh.
        API никогда не читает контакты, фото, файлы или сообщения с телефона.
      responses:
        '200':
          description: Список сессий, новые сверху
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSessions'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/sessions/{sessionID}:
    delete:
      tags: [Auth, Sessions]
      summary: Завершить свою сессию
      description: |
        Отзывает refresh-сессию и немедленно блокирует связанные access-токены
        через Redis denylist. Чужую сессию завершить нельзя.
      parameters:
        - $ref: '#/components/parameters/SessionID'
      responses:
        '204':
          description: Сессия завершена
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/users/{id}:
    get:
      tags: [Users]
      summary: Публичный профиль пользователя
      description: Чужой телефон маскируется, email скрывается.
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Профиль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/users/me:
    patch:
      tags: [Users]
      summary: Обновить профиль
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: Обновлённый профиль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation'
    delete:
      tags: [Users]
      summary: Удалить аккаунт
      description: Каскадно удаляет контакты, токены и репорты.
      responses:
        '204':
          description: Аккаунт удалён
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/users/me/password:
    put:
      tags: [Users]
      summary: Сменить пароль
      description: Отзывает все активные refresh-сессии.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Пароль изменён
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Validation'

  /api/v1/users/me/stats:
    get:
      tags: [Users]
      summary: Личная статистика
      description: |
        Счётчики контактов, избранного, тегов, репортов, предложенных имён и
        активных сессий. Независимые запросы выполняются параллельно.
      responses:
        '200':
          description: Дашборд пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataUserStats'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/v1/contacts:
    get:
      tags: [Contacts]
      summary: Список контактов
      parameters:
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/Favorite'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Страница контактов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedContacts'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Contacts]
      summary: Создать контакт
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactInput'
      responses:
        '201':
          description: Контакт создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataContact'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation'

  /api/v1/contacts/import:
    post:
      tags: [Contacts]
      summary: Массовый импорт контактов
      description: До 500 контактов за запрос, upsert по паре (owner, phone).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportRequest'
      responses:
        '200':
          description: Результат импорта
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataImportResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Validation'

  /api/v1/contacts/{id}:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      tags: [Contacts]
      summary: Получить контакт
      responses:
        '200':
          description: Контакт
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataContact'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Contacts]
      summary: Изменить контакт
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactUpdate'
      responses:
        '200':
          description: Обновлённый контакт
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataContact'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation'
    delete:
      tags: [Contacts]
      summary: Удалить контакт
      responses:
        '204':
          description: Удалён
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/numbers/spam/top:
    get:
      tags: [Numbers]
      summary: Топ спам-номеров
      security: []
      parameters:
        - $ref: '#/components/parameters/LimitTop'
      responses:
        '200':
          description: Рейтинг номеров
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataNumbers'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/v1/numbers/trending:
    get:
      tags: [Numbers]
      summary: Тренды по просмотрам
      description: Номера с наибольшим счётчиком lookup за всё время.
      security: []
      parameters:
        - $ref: '#/components/parameters/LimitTrending'
      responses:
        '200':
          description: Рейтинг просматриваемых номеров
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataNumbers'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/v1/numbers/lookup:
    post:
      tags: [Numbers]
      summary: Пакетный caller-ID lookup
      description: |
        Определяет до 100 номеров за один запрос — удобно для синхронизации
        журнала звонков. Невалидные номера не ломают весь пакет: для них
        возвращается элемент с полем `error`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchLookupRequest'
            example:
              phones: ["+79991234567", "8 999 765-43-21"]
      responses:
        '200':
          description: Результаты по каждому номеру
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataBatchLookupResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Validation'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/v1/spam/categories:
    get:
      tags: [Numbers]
      summary: Каталог категорий спама
      description: Единый источник допустимых значений для POST /numbers/{phone}/spam.
      security: []
      responses:
        '200':
          description: Упорядоченный каталог категорий
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSpamCategories'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/v1/numbers/{phone}:
    get:
      tags: [Numbers]
      summary: Caller-ID lookup
      description: |
        Публичный endpoint. Если номер неизвестен, создаётся пустой профиль.
        Access token опционален и используется только для аналитики.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Phone'
      responses:
        '200':
          description: Карточка номера и теги
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataLookupResult'
        '422':
          $ref: '#/components/responses/Validation'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/v1/numbers/{phone}/tags:
    parameters:
      - $ref: '#/components/parameters/Phone'
    get:
      tags: [Numbers]
      summary: Теги номера
      security: []
      responses:
        '200':
          description: Список тегов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataTags'
        '422':
          $ref: '#/components/responses/Validation'
    post:
      tags: [Numbers]
      summary: Добавить тег
      description: Повторный тег увеличивает его weight и пересчитывает spam score.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagInput'
            example:
              tag: "telemarketing"
      responses:
        '201':
          description: Тег создан или усилен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataTag'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Validation'

  /api/v1/numbers/{phone}/tags/{tagID}:
    delete:
      tags: [Numbers]
      summary: Удалить тег
      description: Доступно автору тега или администратору.
      parameters:
        - $ref: '#/components/parameters/Phone'
        - $ref: '#/components/parameters/TagID'
      responses:
        '204':
          description: Удалён
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/numbers/{phone}/names:
    parameters:
      - $ref: '#/components/parameters/Phone'
    get:
      tags: [Numbers]
      summary: Имена номера из сообщества
      description: Агрегированные варианты имени, отсортированные по числу голосов.
      security: []
      responses:
        '200':
          description: Варианты имени
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataNameCounts'
        '422':
          $ref: '#/components/responses/Validation'
        '429':
          $ref: '#/components/responses/RateLimited'
    post:
      tags: [Numbers]
      summary: Предложить имя для номера
      description: |
        Один голос на пользователя и номер. Повторная отправка заменяет
        предыдущий вариант, а не увеличивает его вес. Отображаемое имя
        пересчитывается по самому популярному варианту.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NumberNameInput'
            example:
              name: "Иван Петров"
      responses:
        '201':
          description: Голос сохранён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataNumberName'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Validation'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/v1/numbers/{phone}/names/{nameID}:
    delete:
      tags: [Numbers]
      summary: Удалить голос за имя
      description: Доступно автору голоса или администратору.
      parameters:
        - $ref: '#/components/parameters/Phone'
        - $ref: '#/components/parameters/NameID'
      responses:
        '204':
          description: Голос удалён
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/numbers/{phone}/spam:
    parameters:
      - $ref: '#/components/parameters/Phone'
    get:
      tags: [Numbers]
      summary: Сводка спам-репортов
      description: Агрегаты по категориям без раскрытия авторов репортов.
      security: []
      responses:
        '200':
          description: Сводка по номеру
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSpamSummary'
        '422':
          $ref: '#/components/responses/Validation'
        '429':
          $ref: '#/components/responses/RateLimited'
    post:
      tags: [Numbers]
      summary: Пожаловаться на спам
      description: Один активный репорт на пользователя и номер. Повтор → 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpamReportInput'
            example:
              category: "telemarketing"
              comment: "Звонят каждый день"
      responses:
        '201':
          description: Репорт принят, возвращена обновлённая карточка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataLookupResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation'

  /api/v1/tags:
    get:
      tags: [Numbers]
      summary: Каталог популярных тегов
      security: []
      parameters:
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Агрегированные теги
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataTagCounts'

  /api/v1/search:
    get:
      tags: [Search]
      summary: Поиск по номерам и контактам
      description: Ищет по номеру/имени в общем справочнике и в личной книге.
      parameters:
        - $ref: '#/components/parameters/SearchQ'
        - $ref: '#/components/parameters/SearchLimit'
      responses:
        '200':
          description: Результаты поиска
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSearchResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Validation'

  /api/v1/admin/stats:
    get:
      tags: [Admin]
      summary: Сводная статистика
      responses:
        '200':
          description: Метрики платформы
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataStats'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/admin/users:
    get:
      tags: [Admin]
      summary: Список пользователей
      parameters:
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Страница пользователей
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUsers'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/admin/users/{id}:
    get:
      tags: [Admin]
      summary: Пользователь по ID
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Профиль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Admin]
      summary: Удалить пользователя
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '204':
          description: Удалён
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/admin/users/{id}/block:
    patch:
      tags: [Admin]
      summary: Блокировка / разблокировка
      description: При блокировке отзываются все refresh-сессии пользователя.
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlockUserRequest'
      responses:
        '200':
          description: Обновлённый пользователь
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/admin/reports:
    get:
      tags: [Admin]
      summary: Очередь спам-репортов
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Страница репортов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedReports'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/admin/reports/{reportID}:
    delete:
      tags: [Admin]
      summary: Удалить спам-репорт
      description: |
        Модерация: удаляет репорт, пересчитывает spam score номера, очищает
        кэш caller-ID и пишет событие `number.spam_deleted` в аудит.
      parameters:
        - $ref: '#/components/parameters/ReportID'
      responses:
        '204':
          description: Репорт удалён
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/admin/numbers/{phone}:
    parameters:
      - $ref: '#/components/parameters/Phone'
    get:
      tags: [Admin]
      summary: Полное досье номера
      description: |
        Admin-only представление «от и до»: профиль, теги, все голоса за имя,
        агрегаты имён, последние репорты, сводка по категориям и audit-события.
        Каждое успешное чтение публикует `admin.number_viewed` с ID администратора.
      responses:
        '200':
          description: Досье номера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataNumberDossier'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Validation'
    patch:
      tags: [Admin]
      summary: Редактировать профиль номера
      description: |
        Частичное обновление: отсутствующее поле не меняется, пустая строка
        очищает поле. Изменение инвалидирует кэш и пишет `admin.number_updated`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminNumberUpdate'
            example:
              name: "Иван Петров"
              carrier: "MTS"
      responses:
        '200':
          description: Обновлённый профиль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataNumber'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Validation'

  /api/v1/admin/audit:
    get:
      tags: [Admin]
      summary: Лента аудита
      description: |
        Все события, дошедшие до `audit_events` через Kafka worker, новые сверху.
        Фильтры комбинируются по AND. Используется для расследований и
        подтверждения того, что досье номера действительно смотрели.
      parameters:
        - $ref: '#/components/parameters/EventType'
        - $ref: '#/components/parameters/AggregateID'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Страница audit-событий
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAudit'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/admin/users/{id}/summary:
    get:
      tags: [Admin]
      summary: Полная карточка пользователя
      description: |
        Профиль, счётчики активности и последние audit-события по этому user_id.
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Сводка пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataUserSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/admin/users/{id}/sessions:
    get:
      tags: [Admin, Sessions]
      summary: Сессии пользователя (только для администратора)
      description: |
        Активные устройства любого пользователя: IP, User-Agent, модель,
        ОС, версия приложения и время последней активности. Только чтение.
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Сессии пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataAdminSessions'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token из register/login/refresh.

  parameters:
    ID:
      name: id
      in: path
      required: true
      description: UUID ресурса
      schema:
        type: string
        format: uuid
    SessionID:
      name: sessionID
      in: path
      required: true
      description: UUID сессии (id записи refresh-токена)
      schema:
        type: string
        format: uuid
    TagID:
      name: tagID
      in: path
      required: true
      description: UUID тега
      schema:
        type: string
        format: uuid
    NameID:
      name: nameID
      in: path
      required: true
      description: UUID голоса за имя
      schema:
        type: string
        format: uuid
    ReportID:
      name: reportID
      in: path
      required: true
      description: UUID спам-репорта
      schema:
        type: string
        format: uuid
    Phone:
      name: phone
      in: path
      required: true
      description: |
        Номер в международном или локальном формате. Нормализуется: принимаются
        `+7…`, `8…`, `00…`, скобки, пробелы, дефисы и full-width цифры;
        результат всегда `+<digits>` (8..15 цифр).
      schema:
        type: string
        example: "+79991234567"
    Q:
      name: q
      in: query
      required: false
      description: Поисковая строка
      schema:
        type: string
        minLength: 2
        maxLength: 64
    SearchQ:
      name: q
      in: query
      required: true
      description: Поисковая строка (2..64 символа)
      schema:
        type: string
        minLength: 2
        maxLength: 64
    EventType:
      name: event_type
      in: query
      required: false
      description: Точное имя типа события, например `admin.number_viewed`
      schema:
        type: string
        example: admin.number_viewed
    AggregateID:
      name: aggregate_id
      in: query
      required: false
      description: ID агрегата (номер телефона или UUID пользователя)
      schema:
        type: string
    Favorite:
      name: favorite
      in: query
      required: false
      description: Фильтр избранных контактов
      schema:
        type: boolean
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    LimitTop:
      name: limit
      in: query
      required: false
      description: Количество номеров в рейтинге
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
    LimitTrending:
      name: limit
      in: query
      required: false
      description: Количество номеров в рейтинге
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 10
    SearchLimit:
      name: limit
      in: query
      required: false
      description: Максимум результатов на каждую коллекцию
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20

  responses:
    BadRequest:
      description: Некорректный запрос
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: Требуется аутентификация или токен невалиден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Недостаточно прав / пользователь заблокирован
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Ресурс не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: Конфликт состояния или дубликат
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Validation:
      description: Ошибка валидации полей
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: VALIDATION_ERROR
              message: request validation failed
              details:
                phone: must be a valid phone number (8..15 digits)
              request_id: 4a8f2c1e9b7d
    RateLimited:
      description: Превышен лимит запросов
      headers:
        Retry-After:
          schema:
            type: integer
          description: Секунды до сброса окна
        X-RateLimit-Limit:
          schema:
            type: integer
        X-RateLimit-Remaining:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: request validation failed
        details:
          type: object
          additionalProperties: true
          nullable: true
        request_id:
          type: string
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/Error'

    Meta:
      type: object
      properties:
        page:
          type: integer
          example: 1
        per_page:
          type: integer
          example: 20
        total:
          type: integer
          format: int64
          example: 42
        total_pages:
          type: integer
          format: int64
          example: 3

    ServiceInfo:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        version:
          type: string
        docs:
          type: string
        openapi:
          type: string
        health:
          type: string
        metrics:
          type: string
        api_base:
          type: string

    Health:
      type: object
      properties:
        status:
          type: string
          example: ok
        version:
          type: string
          example: 1.0.0

    Ready:
      type: object
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        time:
          type: string
          format: date-time
        checks:
          type: object
          additionalProperties:
            type: object
            properties:
              status:
                type: string
                enum: [up, down]
              latency_ms:
                type: integer
                format: int64
              error:
                type: string

    VersionInfo:
      type: object
      properties:
        version:
          type: string
        service:
          type: string
        env:
          type: string
        time:
          type: string
          format: date-time

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        phone:
          type: string
          example: "+79991234567"
        email:
          type: string
          format: email
        display_name:
          type: string
        role:
          type: string
          enum: [user, admin]
        is_blocked:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    DeviceInfo:
      type: object
      description: |
        Необязательный блок с согласия клиента. Эквивалент заголовков
        `X-Device-*` / `X-OS-*` / `X-App-*`. Принимаются только явно
        переданные значения; API не читает данные устройства.
      properties:
        id:
          type: string
          maxLength: 128
          example: "8f3c2a7e-1b2d-4c5e-9f00-1234567890ab"
        name:
          type: string
          maxLength: 128
          example: "Pixel 9 Pro"
        model:
          type: string
          maxLength: 128
          example: "Pixel 9 Pro"
        manufacturer:
          type: string
          maxLength: 128
          example: "Google"
        os:
          type: string
          maxLength: 64
          example: "Android"
        os_version:
          type: string
          maxLength: 64
          example: "15"
        app_version:
          type: string
          maxLength: 64
          example: "1.2.3"
        app_build:
          type: string
          maxLength: 64
          example: "12345"
        client:
          type: string
          maxLength: 32
          example: "android"
        locale:
          type: string
          maxLength: 32
          example: "ru-RU"
        timezone:
          type: string
          maxLength: 64
          example: "Europe/Moscow"
        network_type:
          type: string
          maxLength: 32
          example: "wifi"

    RegisterRequest:
      type: object
      required: [phone, password, display_name]
      properties:
        phone:
          type: string
          example: "+79991234567"
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          description: Минимум одна буква и одна цифра.
        display_name:
          type: string
          minLength: 2
          maxLength: 64
        email:
          type: string
          format: email
          maxLength: 254
        device:
          $ref: '#/components/schemas/DeviceInfo'

    LoginRequest:
      type: object
      required: [phone, password]
      properties:
        phone:
          type: string
        password:
          type: string
          format: password
        device:
          $ref: '#/components/schemas/DeviceInfo'

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
        device:
          $ref: '#/components/schemas/DeviceInfo'

    LogoutRequest:
      type: object
      properties:
        refresh_token:
          type: string
          description: Опционально; access token отзывается всегда.

    Session:
      type: object
      description: Безопасная проекция refresh-сессии без хэша токена.
      properties:
        id:
          type: string
          format: uuid
        current:
          type: boolean
          description: true для сессии, из которой сделан текущий запрос.
        ip:
          type: string
          description: IP при входе (учитывает X-Forwarded-For / X-Real-IP).
        last_ip:
          type: string
        user_agent:
          type: string
        device_id:
          type: string
        device_name:
          type: string
        device_model:
          type: string
        manufacturer:
          type: string
        os:
          type: string
        os_version:
          type: string
        app_version:
          type: string
        app_build:
          type: string
        client:
          type: string
        locale:
          type: string
        timezone:
          type: string
        network_type:
          type: string
        last_seen_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time

    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          format: password
        new_password:
          type: string
          format: password
          minLength: 8
          maxLength: 128

    Tokens:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          format: int64
          example: 900
        expires_at:
          type: string
          format: date-time

    AuthResult:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        tokens:
          $ref: '#/components/schemas/Tokens'

    UserUpdate:
      type: object
      properties:
        display_name:
          type: string
          minLength: 2
          maxLength: 64
        email:
          type: string
          format: email
          description: Пустая строка очищает email.

    Contact:
      type: object
      properties:
        id:
          type: string
          format: uuid
        owner_id:
          type: string
          format: uuid
        phone:
          type: string
        name:
          type: string
        email:
          type: string
        note:
          type: string
        is_favorite:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ContactInput:
      type: object
      required: [phone, name]
      properties:
        phone:
          type: string
          example: "+79997654321"
        name:
          type: string
          minLength: 1
          maxLength: 128
        email:
          type: string
          format: email
        note:
          type: string
          maxLength: 1000
        is_favorite:
          type: boolean
          default: false

    ContactUpdate:
      type: object
      properties:
        phone:
          type: string
        name:
          type: string
          minLength: 1
          maxLength: 128
        email:
          type: string
        note:
          type: string
          maxLength: 1000
        is_favorite:
          type: boolean

    ImportRequest:
      type: object
      required: [contacts]
      properties:
        contacts:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/ContactInput'

    ImportResult:
      type: object
      properties:
        imported:
          type: integer
          example: 2
        skipped:
          type: integer
          example: 0

    Number:
      type: object
      properties:
        phone:
          type: string
        name:
          type: string
        carrier:
          type: string
        country:
          type: string
        spam_score:
          type: integer
          minimum: 0
          maximum: 100
        reports_count:
          type: integer
          format: int64
        lookups_count:
          type: integer
          format: int64
        updated_at:
          type: string
          format: date-time

    Tag:
      type: object
      properties:
        id:
          type: string
          format: uuid
        phone:
          type: string
        tag:
          type: string
        weight:
          type: integer
        created_by:
          type: string
