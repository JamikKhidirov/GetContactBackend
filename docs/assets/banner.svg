<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="GetContact API">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050912"/>
      <stop offset="45%" stop-color="#071425"/>
      <stop offset="100%" stop-color="#0a1f33"/>
      <animate attributeName="x1" values="0;0.25;0" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="1;0.75;1" dur="12s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#818cf8"/>
      <animate attributeName="x1" values="0;1;0" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;2;1" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e3a5f" stroke-width="0.6" opacity="0.35"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="26" fill="url(#grid)"/>

  <circle cx="150" cy="160" r="130" fill="url(#glow)">
    <animate attributeName="r" values="110;150;110" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1050" cy="60" r="90" fill="url(#glow)" opacity="0.6">
    <animate attributeName="r" values="70;110;70" dur="9s" repeatCount="indefinite"/>
  </circle>

  <!-- pulsing signal rings -->
  <g fill="none" stroke="#22d3ee" stroke-width="2">
    <circle cx="150" cy="160" r="58">
      <animate attributeName="r" values="58;108;58" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0;0.9" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="160" r="58">
      <animate attributeName="r" values="58;118;58" dur="3s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0;0.7" dur="3s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- phone -->
  <g transform="translate(110,104)">
    <rect x="0" y="0" width="80" height="116" rx="16" fill="#08111f" stroke="#22d3ee" stroke-width="3"/>
    <rect x="10" y="16" width="60" height="76" rx="8" fill="#0d2036"/>
    <rect x="30" y="6" width="20" height="5" rx="2.5" fill="#1e4b63"/>
    <circle cx="40" cy="104" r="5" fill="#22d3ee">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <path d="M22 42 Q40 24 58 42" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <path d="M16 52 Q40 28 64 52" fill="none" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round">
      <animate attributeName="opacity" values="1;0.25;1" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <path d="M40 64 L47 72 L40 80 L33 72 Z" fill="#818cf8" opacity="0.9"/>
  </g>

  <!-- title -->
  <text x="232" y="126" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="56" font-weight="700" fill="#f8fbff">
    GetContact
  </text>
  <text x="590" y="126" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="56" font-weight="700" fill="url(#accent)">API</text>
  <rect x="712" y="86" width="4" height="46" fill="#22d3ee">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <text x="234" y="170" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="22" fill="#9fb6d4">
    Caller-ID · Community tags · Spam intelligence · Personal contacts
  </text>

  <!-- animated stats bars -->
  <g transform="translate(236,196)">
    <rect x="0" y="30" width="120" height="5" rx="2.5" fill="#12314a"/>
    <rect x="0" y="30" width="120" height="5" rx="2.5" fill="url(#accent)">
      <animate attributeName="width" values="20;120;20" dur="7s" repeatCount="indefinite"/>
    </rect>
    <rect x="140" y="30" width="120" height="5" rx="2.5" fill="#12314a"/>
    <rect x="140" y="30" width="120" height="5" rx="2.5" fill="url(#accent)">
      <animate attributeName="width" values="100;35;100" dur="5.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="280" y="30" width="120" height="5" rx="2.5" fill="#12314a"/>
    <rect x="280" y="30" width="120" height="5" rx="2.5" fill="url(#accent)">
      <animate attributeName="width" values="60;110;60" dur="6.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- stack chips -->
  <g font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" fill="#c7d7ee">
    <g transform="translate(236,250)">
      <rect width="104" height="28" rx="14" fill="#0c2236" stroke="#1e4b63"/>
      <circle cx="16" cy="14" r="4" fill="#22d3ee"><animate attributeName="opacity" values="1;0.25;1" dur="2s" repeatCount="indefinite"/></circle>
      <text x="28" y="19">Go 1.26</text>
    </g>
    <g transform="translate(350,250)">
      <rect width="114" height="28" rx="14" fill="#0c2236" stroke="#1e4b63"/>
      <circle cx="16" cy="14" r="4" fill="#34d399"><animate attributeName="opacity" values="0.25;1;0.25" dur="2.4s" repeatCount="indefinite"/></circle>
      <text x="28" y="19">PostgreSQL</text>
    </g>
    <g transform="translate(474,250)">
      <rect width="86" height="28" rx="14" fill="#0c2236" stroke="#1e4b63"/>
      <circle cx="16" cy="14" r="4" fill="#f87171"><animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/></circle>
      <text x="28" y="19">Redis</text>
    </g>
    <g transform="translate(570,250)">
      <rect width="86" height="28" rx="14" fill="#0c2236" stroke="#1e4b63"/>
      <circle cx="16" cy="14" r="4" fill="#818cf8"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.8s" repeatCount="indefinite"/></circle>
      <text x="28" y="19">Kafka</text>
    </g>
    <g transform="translate(666,250)">
      <rect width="92" height="28" rx="14" fill="#0c2236" stroke="#1e4b63"/>
      <circle cx="16" cy="14" r="4" fill="#fbbf24"><animate attributeName="opacity" values="1;0.35;1" dur="2.2s" repeatCount="indefinite"/></circle>
      <text x="28" y="19">Docker</text>
    </g>
    <g transform="translate(768,250)">
      <rect width="118" height="28" rx="14" fill="#0c2236" stroke="#1e4b63"/>
      <circle cx="16" cy="14" r="4" fill="#38bdf8"><animate attributeName="opacity" values="0.35;1;0.35" dur="2.6s" repeatCount="indefinite"/></circle>
      <text x="28" y="19">Kubernetes</text>
    </g>
  </g>

  <!-- shield -->
  <g transform="translate(1000,120)" filter="url(#soft)" opacity="0.35">
    <path d="M40 0 L80 16 V52 C80 82 40 104 40 104 C40 104 0 82 0 52 V16 Z" fill="#34d399"/>
  </g>
  <g transform="translate(1000,120)">
    <path d="M40 0 L80 16 V52 C80 82 40 104 40 104 C40 104 0 82 0 52 V16 Z" fill="#08111f" stroke="#34d399" stroke-width="3"/>
    <path d="M24 50 L35 62 L58 38" fill="none" stroke="#34d399" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="stroke-dasharray" values="0 100;100 0" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>

  <rect x="0" y="312" width="1200" height="8" fill="#0a1f33"/>
  <rect x="0" y="312" width="220" height="8" fill="url(#accent)">
    <animate attributeName="x" values="-220;1200" dur="5s" repeatCount="indefinite"/>
  </rect>
</svg>
