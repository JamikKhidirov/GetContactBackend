apiVersion: v1
kind: ConfigMap
metadata:
  name: getcontact-config
  namespace: getcontact
  labels:
    app.kubernetes.io/part-of: getcontact
data:
  APP_ENV: production
  HTTP_ADDR: ":8080"
  METRICS_ADDR: ":9091"
  REDIS_ADDR: redis:6379
  KAFKA_BROKERS: kafka:9092
  KAFKA_TOPIC: getcontact.events
  KAFKA_DLQ_TOPIC: getcontact.events.dlq
  KAFKA_GROUP_ID: getcontact-workers
  KAFKA_ENABLED: "true"
  JWT_ISSUER: getcontact
  JWT_ACCESS_TTL: 15m
  JWT_REFRESH_TTL: 720h
  CORS_ALLOWED_ORIGINS: "https://getcontact.local,http://localhost:3000"
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_PUBLIC_RPM: "120"
  RATE_LIMIT_AUTH_RPM: "20"
  # Comma-separated CIDRs of your ingress/LB. Leave empty to trust RemoteAddr.
  TRUSTED_PROXIES: ""
  # Email OTP. Production refuses EMAIL_PROVIDER=log, so SMTP is required and
  # the API will not start until SMTP_HOST/SMTP_USERNAME are real and
  # SMTP_PASSWORD/EMAIL_CODE_SECRET are set in the Secret below.
  EMAIL_ENABLED: "true"
  EMAIL_PROVIDER: smtp
  EMAIL_FROM_NAME: GetContact
  EMAIL_FROM_ADDRESS: "no-reply@getcontact.local"
  EMAIL_SUPPORT_ADDRESS: "support@getcontact.local"
  EMAIL_CODE_TTL: 10m
  EMAIL_CODE_MAX_ATTEMPTS: "5"
  EMAIL_CODE_COOLDOWN: 60s
  EMAIL_OUTBOX_INTERVAL: 1s
  EMAIL_OUTBOX_BATCH: "50"
  SMTP_HOST: smtp.gmail.com
  SMTP_PORT: "587"
  SMTP_USERNAME: "no-reply@getcontact.local"
  SMTP_TLS: "true"
  SMTP_TIMEOUT: 10s
  ADMIN_PHONE: "+79990000000"
  ADMIN_NAME: Platform Admin
  DB_MAX_CONNS: "25"
  DB_MIN_CONNS: "5"
  REDIS_CACHE_TTL: 60s
---
apiVersion: v1
kind: Secret
metadata:
  name: getcontact-secrets
  namespace: getcontact
  labels:
    app.kubernetes.io/part-of: getcontact
type: Opaque
stringData:
  # IMPORTANT: change these before deploying. Keep DATABASE_URL in sync with
  # POSTGRES_PASSWORD. Do not commit real production secrets.
  POSTGRES_PASSWORD: "CHANGE_ME_postgres"
  DATABASE_URL: "postgres://getcontact:CHANGE_ME_postgres@postgres:5432/getcontact?sslmode=disable"
  JWT_SECRET: "CHANGE_ME_2f8c1a7e4b9d6f3a0c5e8b2d7f4a1c9e"
  EMAIL_CODE_SECRET: "CHANGE_ME_email_code_secret_32_chars_minimum"
  SMTP_PASSWORD: "CHANGE_ME_gmail_app_password"
  ADMIN_PASSWORD: "CHANGE_ME_admin_password_12_chars"
