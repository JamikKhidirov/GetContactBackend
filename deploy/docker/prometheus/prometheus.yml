global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    stack: getcontact

rule_files:
  - /etc/prometheus/alerts.yml
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: getcontact-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8080"]
        labels:
          service: getcontact-api
          component: api

  - job_name: getcontact-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:9091"]
        labels:
          service: getcontact-worker
          component: worker

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
